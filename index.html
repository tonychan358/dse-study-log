<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 應用程式名稱＝主畫面圖示下面顯示嘅名（SIR 2026-08-17 定名「夠鐘
       溫書」）。畫面上嘅品牌區塊係另一回事，繼續用「2026 - 2027」／
       「陳老師 HKDSE 衝刺計劃」，兩者刻意唔同。 -->
  <title>夠鐘溫書</title>

  <!-- PWA：manifest + Service Worker（sw.js，2026-08-17 加）。SW 行網路
       優先，唔會快取住舊畫面（見 sw.js 頭註）；佢同時係 Chromium 發出
       beforeinstallprompt 的先決條件，冇佢就冇「一撳安裝」掣。
       start_url / scope 刻意用相對路徑 "./"：manifest 的相對 URL 係以
       manifest 檔案本身所在位置為 base，唔係頁面 URL。manifest.webmanifest
       喺兩邊部署都放喺 app 根目錄——GitHub Pages 係
       https://tonychan358.github.io/dse-study-log/manifest.webmanifest，
       本機開發係 http://localhost:8005/manifest.webmanifest——所以 "./"
       喺兩邊都會正確解析到各自嘅根目錄，唔使寫死絕對路徑或猜子路徑。 -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="theme-color" content="#2563EB">

  <!-- iOS Safari 唔認 manifest 嘅 display:standalone，要另外呢幾個 meta
       tag 先會喺「加至主畫面」後隱藏網址列、用 standalone 模式打開。 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="夠鐘溫書">

  <!-- 樣式由 src/main.tsx import（Vite 打包）。 -->
  <script type="module" crossorigin src="./assets/index-DgbdwJr5.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-COOymwnh.css">
</head>
<body>
  <!-- v2（2026-10）：React 由 src/main.tsx 掛入 #root；離線狀態列改由 React StatusBar 畫。
       Chart.js／supabase-js 由 npm 打包，SW 清單自動注入，離線一樣攞到。 -->
  <div id="root">載入中…</div>
</body>
</html>
